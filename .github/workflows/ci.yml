name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast checks: no root, no runsc, no real mounts. tenantd-testkit's fakes
  # plus the storage/layer/image backends run against temp dirs.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Real backends: XFS project quota as root, real overlay mounts and network
  # namespaces in a user namespace, and a real registry pull. The build stays
  # unprivileged; only the test binaries that need root go through cargo's
  # target runner, so target/ isn't root-owned.
  integration:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      TENANTD_XFS_TEST_ROOT: /mnt/tenantd-xfs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install host packages
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler xfsprogs
      - name: Create XFS volume with project quota
        run: sudo ci/setup-xfs.sh "$TENANTD_XFS_TEST_ROOT" 4G
      # M0-adjacent gates: quota is enforced and reclaimed, and whiteouts
      # become real device nodes. Both need real root.
      - name: XFS project quota and whiteout conversion (root)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: cargo test -p tenantd-storage-xfs -p tenantd-image --locked -- --ignored
      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), which makes
      # `unshare -r` fail to write /proc/self/uid_map. Lift it for this job.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Overlay mounts and netns only need CAP_SYS_ADMIN inside a user+mount
      # namespace.
      - name: Real overlay mounts and netns (user namespace)
        run: unshare -rmn cargo test -p tenantd-layer -p tenantd-net --locked -- --ignored
      - name: Dump quota state on failure
        if: failure()
        run: |
          sudo xfs_quota -x -c 'report -p -ah' "$TENANTD_XFS_TEST_ROOT" || true
          mount | grep -E 'tenantd|/mnt/tenantd-xfs' || true
