name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # keyless cosign signing

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      version: ${{ github.ref_name }}
      release_tag: ${{ github.ref_name }}
      release_name: ${{ github.ref_name }}
      publish_repos: true
    secrets: inherit
