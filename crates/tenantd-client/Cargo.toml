[package]
name = "tenantd-client"
description = "Generated gRPC client (and server stubs) for tenantd over a Unix socket or mTLS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
readme = "README.md"
keywords = ["tenantd", "grpc", "sandbox", "gvisor", "client"]
categories = ["api-bindings", "network-programming"]
# The codegen check reads ../../proto, which isn't in the package.
exclude = ["/tests"]

[dependencies]
hyper-util.workspace = true
libc.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "macros"] }
tokio-stream.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true

[dev-dependencies]
tempfile.workspace = true
tonic-prost-build.workspace = true

[features]
# connect_tls: the API over TCP with mutual TLS (tenantd's [server.tls]).
tls = ["dep:rustls", "dep:tokio-rustls"]

[package.metadata.docs.rs]
all-features = true
