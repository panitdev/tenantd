// tenantd API, served over a Unix socket. Every mutating call is idempotent
// on the caller-supplied ID: repeating a create with the same spec returns
// the existing object; a different spec returns ALREADY_EXISTS. Policy
// denials return PERMISSION_DENIED naming the rule that refused.
syntax = "proto3";

package tenantd.v1;

service Tenants {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  // Takes effect immediately. Lowering below current usage is allowed and
  // blocks new writes.
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // Fails while sandboxes exist unless force.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
}

service Sandboxes {
  // Overrides may only tighten the profile.
  rpc CreateSandbox(CreateSandboxRequest) returns (Sandbox);
  rpc GetSandbox(SandboxRef) returns (Sandbox);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  // The writable layer is kept while stopped if the profile's layer
  // survives stop (host-overlay does).
  rpc StopSandbox(SandboxRef) returns (Sandbox);
  rpc StartSandbox(SandboxRef) returns (Sandbox);
  // Removes the runsc container, overlay mount and upper directory.
  rpc DestroySandbox(SandboxRef) returns (DestroySandboxResponse);
}

// Containers inside running sandboxes: the sandbox's image on a writable
// root of their own (in the tenant's quota), sharing the sandbox's kernel,
// network and limits, so many of them cost one sandbox. A container is never
// restarted: it ends "exited" when its init exits or its sandbox stops, and
// keeps its root until deleted.
//
// A container mounts the tenant's volumes only through the slots its
// profile declares, bound at create; changing a binding means recreating
// it. A container asking for the profile's FUSE slot gets a FUSE mount
// whose server is the caller: it is created "created" and waits there.
// The caller then opens ServeFuse, answers the filesystem requests it
// receives, and calls StartContainer. tenantd speaks the kernel FUSE
// protocol itself and never runs filesystem code: the caller sees path-based
// operations (stat, read, write, ...), not kernel messages.
service Containers {
  // Idempotent on (tenant, sandbox, id), like every create. The sandbox
  // must be running, and bound volumes ready.
  rpc CreateContainer(CreateContainerRequest) returns (Container);
  // Runs a "created" container, once its FUSE server has called ServeFuse.
  // Starting a running one returns it; an exited one never restarts.
  rpc StartContainer(ContainerRef) returns (Container);
  rpc GetContainer(ContainerRef) returns (Container);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  // Ends its processes and removes it and its root. Their process rows stay
  // until their retention passes.
  rpc DeleteContainer(ContainerRef) returns (DeleteContainerResponse);
  // Serves the container's FUSE slot. The caller's first message is
  // `attach`; tenantd answers with `attached`, then sends `request` events,
  // each answered by a `response` with the same id, in any order. `cancel`
  // says the kernel gave up on a request (its response is then ignored).
  // `invalidate` drops what tenantd cached (attributes, listings, negative
  // entries) after the underlying data changed behind its back.
  //
  // One server per container: a new ServeFuse replaces the old stream, which
  // ends ABORTED, and requests it had not answered fail EIO (writes are
  // never replayed). While none is attached, requests queue, so container
  // I/O waits. Starting a "created" container needs a server to have
  // attached. A tenantd restart loses the session: a "created" container
  // gets a fresh one, a running one must be recreated.
  rpc ServeFuse(stream FuseServerMessage) returns (stream FuseServerEvent);
}

// File access to a running container's root, as the container sees it: the
// files its own processes read and write, for callers that would otherwise
// have to exec a binary in the image and parse its output.
//
// Paths are absolute within the container ("/" is its root), without "."
// or ".." parts, and resolve as the container's own processes see them:
// its mounts, /tmp, volumes and FUSE slot included.
//
// By default each call runs tenantd's file helper inside the container (a
// `runsc exec` per call, so tens of milliseconds each), which works on every
// layer and costs the container nothing otherwise. A container created with
// host_file_access is served from the host instead, much faster per call;
// the runtime then revalidates every file lookup in that container against
// the host, which slows file-heavy work there. Paths the host can't see
// (mounts) still go through the helper. A container created before file
// access existed has no helper: FAILED_PRECONDITION until it is recreated.
//
// Filesystem errors come back in the reply as Linux errno values with a
// detail for logs, the way ServeFuse takes them; a gRPC error means the
// call itself was refused (NOT_FOUND for an unknown container,
// FAILED_PRECONDITION when it is not running, PERMISSION_DENIED by policy).
//
// What a caller may do is the sandbox profile's exec policy: exec must be
// enabled, and every call acts as `user` ("" = the image user; otherwise
// one of profile exec.users), with that user's permissions, resolved as an
// exec's are. Files it creates are that user's. Writes are in the tenant's
// quota: past it they fail with ENOSPC, as the container's own writes do
// (XFS project quotas report ENOSPC, not EDQUOT).
service Files {
  // lstat, or stat with follow. Returns the resolved path as well.
  rpc Stat(FileStatRequest) returns (FileStatResponse);
  // The whole directory, each entry with its lstat attributes.
  rpc ReadDir(FileReadDirRequest) returns (FileReadDirResponse);
  // A regular file's bytes from offset, in chunks. The first message
  // carries the file's attributes (or the errno that ended the call).
  rpc Read(FileReadRequest) returns (stream FileReadResponse);
  // The first message is `header`, then the body as `data` messages; the
  // client closing its side ends the body. The body goes to a temporary
  // file beside the target, which replaces it only once the whole body
  // arrived: a stream that fails or is cancelled leaves the target as it
  // was. A symlink at the path is followed, and its target replaced.
  // Replacing means hard links to the old file keep the old body, xattrs
  // and ACLs are not carried over, it takes write permission on the
  // directory, and both bodies count against the quota until the rename.
  rpc Write(stream FileWriteRequest) returns (FileWriteResponse);
  // renameat2(2), flags RENAME_NOREPLACE (1) or RENAME_EXCHANGE (2).
  rpc Rename(FileRenameRequest) returns (FileRenameResponse);
  // unlink(2), or rmdir(2) with directory.
  rpc Remove(FileRemoveRequest) returns (FileRemoveResponse);
}

// Processes inside running sandboxes. Only processes tenantd started are
// visible; the sandbox's init process and anything the image spawns are out
// of reach. What a caller may run is the sandbox profile's exec policy.
service Processes {
  // Idempotent on (tenant, sandbox, id), like every create. The sandbox must
  // be running. IDs of removed processes stay reserved for a while
  // (ALREADY_EXISTS).
  rpc StartProcess(StartProcessRequest) returns (Process);
  rpc GetProcess(ProcessRef) returns (Process);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc SignalProcess(SignalProcessRequest) returns (Process);
  // Blocks until the process exits or timeout_ms passes; returns its current state.
  rpc WaitProcess(WaitProcessRequest) returns (Process);
  // Retained output from an offset; follow=true keeps the stream open until exit.
  rpc ReadOutput(ReadOutputRequest) returns (stream OutputChunk);
  // Exited processes only, unless force (SIGKILL first).
  rpc DeleteProcess(DeleteProcessRequest) returns (DeleteProcessResponse);
}

// Volumes: durable directories in a tenant's quota, the only state that
// outlives a container. Containers mount them through their profile's
// slots; callers on the host use them at their path.
service Volumes {
  // Idempotent on (tenant, id), like every create. The owner must be root
  // or a caller UID; mode takes permission and sticky bits only.
  rpc CreateVolume(CreateVolumeRequest) returns (Volume);
  rpc GetVolume(VolumeRef) returns (Volume);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  // Removes it and everything in it. Fails while a container (even an
  // exited one) binds it.
  rpc DeleteVolume(VolumeRef) returns (DeleteVolumeResponse);
  // Removes what is at or below path_prefix and has not been accessed,
  // modified or changed for older_than_secs (0: all of it). Directories go
  // once empty; the volume itself stays. Symlinks are removed, never
  // followed, and mounts are not entered.
  rpc PruneVolume(PruneVolumeRequest) returns (PruneVolumeResponse);
}

service System {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream Event);
}

message TenantLimits {
  uint64 storage_bytes = 1;
  // Ceilings across the tenant's running sandboxes.
  optional double cpus = 2;
  optional uint64 memory_bytes = 3;
}

message Tenant {
  string id = 1;
  TenantLimits limits = 2;
  uint32 project_id = 3;
  string state = 4;
  uint64 used_bytes = 5;
  uint32 sandbox_count = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message CreateTenantRequest {
  string id = 1;
  TenantLimits limits = 2;
}

message UpdateTenantRequest {
  string id = 1;
  TenantLimits limits = 2;
}

message GetTenantRequest {
  string id = 1;
}

message ListTenantsRequest {}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message DeleteTenantRequest {
  string id = 1;
  bool force = 2;
}

message DeleteTenantResponse {}

message Overrides {
  optional uint64 memory_bytes = 1;
  optional double cpus = 2;
  optional uint32 pids = 3;
  optional uint64 size_bytes = 4;
}

message CreateSandboxRequest {
  string tenant = 1;
  string id = 2;
  string profile = 3;
  string image = 4;
  Overrides overrides = 5;
}

message SandboxRef {
  string tenant = 1;
  string id = 2;
}

message ListSandboxesRequest {
  string tenant = 1;
}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message DestroySandboxResponse {}

message Resources {
  uint64 memory_bytes = 1;
  double cpus = 2;
  uint32 pids = 3;
  optional uint64 size_bytes = 4;
}

message Sandbox {
  string tenant = 1;
  string id = 2;
  string profile = 3;
  string image = 4;
  string image_digest = 5;
  string state = 6;
  Resources resources = 7;
  optional int32 exit_code = 8;
  string rootfs = 9;
  string network = 10;
  bool layer_survives_stop = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

message CreateContainerRequest {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  // Its init; empty runs the image's entrypoint and cmd. Anything else needs
  // the profile's exec rights and runs as the image user. No shell is implied.
  repeated string args = 4;
  // Slot name -> volume ID. Slots marked required must be bound.
  map<string, string> volumes = 5;
  // Mount the profile's FUSE slot; the container then waits "created".
  bool fuse = 6;
  // Serve Files calls on it from the host, not through the in-container
  // helper; see service Files for the cost. Needs a layer that keeps
  // container roots on the host (not memory).
  bool host_file_access = 7;
}

message ContainerRef {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
}

message ListContainersRequest {
  string tenant = 1;
  string sandbox = 2;
}

message ListContainersResponse {
  repeated Container containers = 1;
}

message DeleteContainerResponse {}

message Container {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  string state = 4;             // creating | created | running | exited | destroying
  optional int32 exit_code = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  repeated string args = 8;     // empty: the image's entrypoint and cmd
  repeated VolumeMount volumes = 9;
  string fuse_path = 10;        // where its FUSE slot is mounted; "" = none
  bool host_file_access = 11;
}

// ---- ServeFuse ----------------------------------------------------------
// Paths are absolute within the exported tree ("/" is the root), without
// "." or ".." parts. errno values are Linux's.

message FuseServerMessage {
  oneof msg {
    Attach attach = 1;          // first message, once
    FuseResponse response = 2;
    Invalidate invalidate = 3;
  }
}

message FuseServerEvent {
  oneof event {
    Attached attached = 1;      // first event, once
    FuseRequest request = 2;
    Cancel cancel = 3;
  }
}

message Attach {
  ContainerRef container = 1;
  uint32 version = 2;           // protocol version; 1
  FuseLimits limits = 3;        // what this server can take
}

message Attached {
  uint64 generation = 1;        // counts attaches of this container
  FuseLimits limits = 2;        // negotiated: the smaller of both sides
}

// Zero means "no preference" from a server; tenantd's answer is never zero.
message FuseLimits {
  uint32 max_read = 1;          // bytes per Read
  uint32 max_write = 2;         // bytes per Write
  uint32 max_inflight = 3;      // unanswered requests
}

message Cancel {
  uint64 id = 1;
}

message Invalidate {
  oneof target {
    string path = 1;
    bytes object_id = 2;        // every path of this object
  }
  bool recursive = 3;           // path only: everything below it as well
}

message FuseRequest {
  uint64 id = 1;
  // Whose access this is, as the kernel reports it.
  uint32 uid = 2;
  uint32 gid = 3;
  uint32 pid = 4;
  oneof op {
    Stat stat = 10;
    ReadDir read_dir = 11;
    Readlink readlink = 12;
    Open open = 13;
    Read read = 14;
    Write write = 15;
    Flush flush = 16;
    Release release = 17;
    Fsync fsync = 18;
    Create create = 19;
    Mkdir mkdir = 20;
    Unlink unlink = 21;
    Rmdir rmdir = 22;
    Rename rename = 23;
    Symlink symlink = 24;
    SetAttr set_attr = 25;
    StatFs stat_fs = 26;
  }
}

message Stat { string path = 1; }
// The whole directory with each entry's attributes, in one round trip.
message ReadDir { string path = 1; }
message Readlink { string path = 1; }
message Open { string path = 1; uint32 flags = 2; }   // open(2) flags
message Read { string path = 1; uint64 handle = 2; uint64 offset = 3; uint32 size = 4; }
message Write { string path = 1; uint64 handle = 2; uint64 offset = 3; bytes data = 4; }
// Every close(2) of a descriptor; Release follows the last one.
message Flush { string path = 1; uint64 handle = 2; }
message Release { string path = 1; uint64 handle = 2; }
message Fsync { string path = 1; uint64 handle = 2; bool datasync = 3; }
message Create { string path = 1; uint32 mode = 2; uint32 flags = 3; }
message Mkdir { string path = 1; uint32 mode = 2; }
message Unlink { string path = 1; }
message Rmdir { string path = 1; }
message Rename { string from = 1; string to = 2; uint32 flags = 3; }  // renameat2 flags
message Symlink { string path = 1; string target = 2; }
message SetAttr {
  string path = 1;
  optional uint64 handle = 2;   // set when the call came through an open file
  optional uint32 mode = 3;
  optional uint32 uid = 4;
  optional uint32 gid = 5;
  optional uint64 size = 6;
  optional int64 atime_ns = 7;
  optional int64 mtime_ns = 8;
}
message StatFs {}

// errno == 0 is success and sets `result` as the request's op calls for:
//   Stat, Mkdir, Symlink, SetAttr -> attr      Readlink -> target
//   ReadDir -> dir     Open, Create -> open    Read -> data
//   Write -> write     StatFs -> statfs
//   Flush, Release, Fsync, Unlink, Rmdir, Rename -> ok
message FuseResponse {
  uint64 id = 1;
  int32 errno = 2;
  string detail = 3;            // for logs; never shown to the container
  uint32 negative_ttl_ms = 4;   // with ENOENT: how long "absent" may be cached
  oneof result {
    FileAttr attr = 10;
    DirListing dir = 11;
    OpenReply open = 12;
    bytes data = 13;
    WriteReply write = 14;
    string target = 15;
    StatFsReply statfs = 16;
    FuseOk ok = 17;
  }
}

message FuseOk {}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_FILE = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMLINK = 3;
  FILE_KIND_FIFO = 4;
  FILE_KIND_SOCKET = 5;
  FILE_KIND_CHAR_DEVICE = 6;
  FILE_KIND_BLOCK_DEVICE = 7;
}

message FileAttr {
  FileKind kind = 1;
  uint32 mode = 2;              // permission, setuid/setgid and sticky bits
  uint64 size = 3;
  uint32 uid = 4;
  uint32 gid = 5;
  uint32 nlink = 6;
  int64 atime_ns = 7;
  int64 mtime_ns = 8;
  int64 ctime_ns = 9;
  uint32 rdev = 10;
  uint32 ttl_ms = 11;           // how long tenantd and the kernel may cache this
  // Identity of the file itself, equal for its hard links. Lets tenantd give
  // them one inode; without it every path is its own file.
  optional bytes object_id = 12;
}

message DirListing {
  repeated DirEntry entries = 1;    // without "." and ".."
}

message DirEntry {
  string name = 1;
  FileAttr attr = 2;
}

message OpenReply {
  uint64 handle = 1;            // echoed in Read, Write, Flush, Release, Fsync
  bool keep_cache = 2;          // the kernel may keep its page cache
  bool direct_io = 3;           // bypass the page cache
  bool buffered_writes = 4;     // tenantd may batch writes before sending them
  FileAttr attr = 5;            // always set for Create
  optional bytes inline_data = 6;   // the file's start, if small: saves the first Read
}

message WriteReply {
  uint32 written = 1;
  FileAttr attr = 2;            // after the write
}

message StatFsReply {
  uint64 blocks = 1;
  uint64 bfree = 2;
  uint64 bavail = 3;
  uint64 files = 4;
  uint64 ffree = 5;
  uint32 bsize = 6;
  uint32 namelen = 7;
}

// ---- Files --------------------------------------------------------------

message FileStatRequest {
  ContainerRef container = 1;
  string path = 2;
  bool follow = 3;              // stat(2) rather than lstat(2)
  string user = 4;              // "" = image user; otherwise in exec.users
}

message FileStatResponse {
  int32 errno = 1;
  string detail = 2;
  FileAttr attr = 3;
  string path = 4;              // the path stat-ed, symlinks resolved when follow
}

message FileReadDirRequest {
  ContainerRef container = 1;
  string path = 2;
  string user = 3;
}

message FileReadDirResponse {
  int32 errno = 1;
  string detail = 2;
  repeated DirEntry entries = 3;    // without "." and ".."
}

message FileReadRequest {
  ContainerRef container = 1;
  string path = 2;              // symlinks are followed
  uint64 offset = 3;
  uint64 length = 4;            // 0: to the end of the file
  string user = 5;
}

message FileReadResponse {
  int32 errno = 1;              // set on the last message when the read failed
  string detail = 2;
  FileAttr attr = 3;            // first message only
  uint64 offset = 4;            // of data
  bytes data = 5;
}

message FileWriteRequest {
  oneof msg {
    FileWriteHeader header = 1; // first message, once
    bytes data = 2;
  }
}

message FileWriteHeader {
  ContainerRef container = 1;
  string path = 2;
  optional uint32 mode = 3;     // default: the replaced file's, or 0644
  bool parents = 4;             // create missing parent directories (0755)
  bool exclusive = 5;           // fail with EEXIST if the path exists
  // The body's length, when known: a body that ends short or long fails
  // with EIO, leaving the target as it was.
  optional uint64 size = 6;
  string user = 7;
}

message FileWriteResponse {
  int32 errno = 1;
  string detail = 2;
  FileAttr attr = 3;            // of the file written
  uint64 written = 4;
}

message FileRenameRequest {
  ContainerRef container = 1;
  string from = 2;
  string to = 3;
  uint32 flags = 4;             // renameat2 flags
  string user = 5;
}

message FileRenameResponse {
  int32 errno = 1;
  string detail = 2;
}

message FileRemoveRequest {
  ContainerRef container = 1;
  string path = 2;
  bool directory = 3;           // rmdir: the directory must be empty
  string user = 4;
}

message FileRemoveResponse {
  int32 errno = 1;
  string detail = 2;
}

message VolumeMount {
  string slot = 1;
  string volume = 2;
  string path = 3;              // inside the container
  bool read_only = 4;
}

message CreateVolumeRequest {
  string tenant = 1;
  string id = 2;
  optional uint32 uid = 3;      // default 0
  optional uint32 gid = 4;      // default 0
  optional uint32 mode = 5;     // default 0755
}

message VolumeRef {
  string tenant = 1;
  string id = 2;
}

message ListVolumesRequest {
  string tenant = 1;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message DeleteVolumeResponse {}

message PruneVolumeRequest {
  VolumeRef volume = 1;
  string path_prefix = 2;       // relative to the volume; "" = all of it
  uint64 older_than_secs = 3;
}

message PruneVolumeResponse {
  uint64 removed_entries = 1;
  uint64 removed_bytes = 2;
}

message Volume {
  string tenant = 1;
  string id = 2;
  string state = 3;             // creating | ready | deleting
  uint32 uid = 4;
  uint32 gid = 5;
  uint32 mode = 6;
  string path = 7;              // on the host
  int64 created_at = 8;
  int64 updated_at = 9;
}

message StartProcessRequest {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;              // unique across the sandbox and its containers
  repeated string args = 4;  // required; no shell is implied
  repeated string env = 5;   // KEY=VALUE, appended to the image env
  string cwd = 6;            // default: the image WorkingDir
  string user = 7;           // "" = image user; otherwise must be in profile exec.users
  bool tty = 8;              // not supported yet
  bool stdin = 9;            // not supported yet
  string container = 10;     // "" = the sandbox's own; otherwise must be running
}

message ProcessRef {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
}

message ListProcessesRequest {
  string tenant = 1;
  string sandbox = 2;
}

message ListProcessesResponse {
  repeated Process processes = 1;
}

enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGTERM = 1;
  SIGKILL = 2;
  SIGINT = 3;
  SIGHUP = 4;
  SIGQUIT = 5;
  SIGUSR1 = 6;
  SIGUSR2 = 7;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STDOUT = 1;
  STDERR = 2;
}

message SignalProcessRequest {
  ProcessRef process = 1;
  Signal signal = 2;
}

message WaitProcessRequest {
  ProcessRef process = 1;
  uint64 timeout_ms = 2;  // 0: until exit (the call's deadline still applies)
}

message DeleteProcessRequest {
  ProcessRef process = 1;
  bool force = 2;
}

message DeleteProcessResponse {}

message Process {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  repeated string args = 4;
  string user = 5;
  bool tty = 6;
  string state = 7;             // starting | running | exited | lost
  uint32 pid = 8;               // PID inside the sandbox; 0 until running
  optional int32 exit_code = 9;
  // Set when a signal killed it; SIGNAL_UNSPECIFIED for a signal outside
  // the enum (e.g. SIGSEGV).
  optional Signal signal = 10;
  uint64 stdout_dropped = 11;   // bytes written past output_limit and discarded
  uint64 stderr_dropped = 12;
  int64 created_at = 13;
  optional int64 exited_at = 14;
  uint64 output_limit = 15;     // bytes kept per stream
  string container = 16;        // "" = the sandbox's own
}

message ReadOutputRequest {
  ProcessRef process = 1;
  Stream stream = 2;
  uint64 offset = 3;            // byte offset within that stream
  bool follow = 4;
}

message OutputChunk {
  oneof kind {
    Data data = 1;
    Truncated truncated = 2;
  }
  message Data {
    uint64 offset = 1;
    bytes bytes = 2;
  }
  // Sent once when a read reaches the stream's limit and output was dropped.
  // Generated by the read path; never stored.
  message Truncated {
    uint64 offset = 1;
    uint64 dropped_bytes = 2;
  }
}

message HealthRequest {}

message ComponentHealth {
  string name = 1;
  bool ok = 2;
  string message = 3;
}

message HealthResponse {
  // False when quota or runtime enforcement is failing; creates are refused.
  bool enforcing = 1;
  repeated ComponentHealth components = 2;
}

message WatchEventsRequest {}

message Event {
  int64 time = 1;
  oneof kind {
    SandboxExited sandbox_exited = 2;
    SandboxOom sandbox_oom = 3;
    QuotaExceeded quota_exceeded = 4;
    ReconcileAction reconcile = 5;
    ProcessExited process_exited = 6;
    ContainerExited container_exited = 7;
  }
}

message SandboxExited {
  string tenant = 1;
  string id = 2;
  optional int32 exit_code = 3;
}

message SandboxOom {
  string tenant = 1;
  string id = 2;
}

message ContainerExited {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  optional int32 exit_code = 4;
}

message QuotaExceeded {
  string tenant = 1;
  uint64 used_bytes = 2;
  uint64 limit_bytes = 3;
}

message ReconcileAction {
  string action = 1;
  string target = 2;
  string detail = 3;
}

message ProcessExited {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  optional int32 exit_code = 4;
  optional Signal signal = 5;
  uint64 stdout_dropped = 6;
  uint64 stderr_dropped = 7;
}
