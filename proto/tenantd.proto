// tenantd API, served over a Unix socket. Every mutating call is idempotent
// on the caller-supplied ID: repeating a create with the same spec returns
// the existing object; a different spec returns ALREADY_EXISTS. Policy
// denials return PERMISSION_DENIED naming the rule that refused.
syntax = "proto3";

package tenantd.v1;

service Tenants {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  // Takes effect immediately. Lowering below current usage is allowed and
  // blocks new writes.
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // Fails while sandboxes exist unless force.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
}

service Sandboxes {
  // Overrides may only tighten the profile.
  rpc CreateSandbox(CreateSandboxRequest) returns (Sandbox);
  rpc GetSandbox(SandboxRef) returns (Sandbox);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  // The writable layer is kept while stopped if the profile's layer
  // survives stop (host-overlay does).
  rpc StopSandbox(SandboxRef) returns (Sandbox);
  rpc StartSandbox(SandboxRef) returns (Sandbox);
  // Removes the runsc container, overlay mount and upper directory.
  rpc DestroySandbox(SandboxRef) returns (DestroySandboxResponse);
}

// Processes inside running sandboxes. Only processes tenantd started are
// visible; the sandbox's init process and anything the image spawns are out
// of reach. What a caller may run is the sandbox profile's exec policy.
service Processes {
  // Idempotent on (tenant, sandbox, id), like every create. The sandbox must
  // be running. IDs of removed processes stay reserved for a while
  // (ALREADY_EXISTS).
  rpc StartProcess(StartProcessRequest) returns (Process);
  rpc GetProcess(ProcessRef) returns (Process);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc SignalProcess(SignalProcessRequest) returns (Process);
  // Blocks until the process exits or timeout_ms passes; returns its current state.
  rpc WaitProcess(WaitProcessRequest) returns (Process);
  // Retained output from an offset; follow=true keeps the stream open until exit.
  rpc ReadOutput(ReadOutputRequest) returns (stream OutputChunk);
  // Exited processes only, unless force (SIGKILL first).
  rpc DeleteProcess(DeleteProcessRequest) returns (DeleteProcessResponse);
}

service System {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream Event);
}

message TenantLimits {
  uint64 storage_bytes = 1;
  // Ceilings across the tenant's running sandboxes.
  optional double cpus = 2;
  optional uint64 memory_bytes = 3;
}

message Tenant {
  string id = 1;
  TenantLimits limits = 2;
  uint32 project_id = 3;
  string state = 4;
  uint64 used_bytes = 5;
  uint32 sandbox_count = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message CreateTenantRequest {
  string id = 1;
  TenantLimits limits = 2;
}

message UpdateTenantRequest {
  string id = 1;
  TenantLimits limits = 2;
}

message GetTenantRequest {
  string id = 1;
}

message ListTenantsRequest {}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message DeleteTenantRequest {
  string id = 1;
  bool force = 2;
}

message DeleteTenantResponse {}

message Overrides {
  optional uint64 memory_bytes = 1;
  optional double cpus = 2;
  optional uint32 pids = 3;
  optional uint64 size_bytes = 4;
}

message CreateSandboxRequest {
  string tenant = 1;
  string id = 2;
  string profile = 3;
  string image = 4;
  Overrides overrides = 5;
}

message SandboxRef {
  string tenant = 1;
  string id = 2;
}

message ListSandboxesRequest {
  string tenant = 1;
}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message DestroySandboxResponse {}

message Resources {
  uint64 memory_bytes = 1;
  double cpus = 2;
  uint32 pids = 3;
  optional uint64 size_bytes = 4;
}

message Sandbox {
  string tenant = 1;
  string id = 2;
  string profile = 3;
  string image = 4;
  string image_digest = 5;
  string state = 6;
  Resources resources = 7;
  optional int32 exit_code = 8;
  string rootfs = 9;
  string network = 10;
  bool layer_survives_stop = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

message StartProcessRequest {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  repeated string args = 4;  // required; no shell is implied
  repeated string env = 5;   // KEY=VALUE, appended to the image env
  string cwd = 6;            // default: the image WorkingDir
  string user = 7;           // "" = image user; otherwise must be in profile exec.users
  bool tty = 8;              // not supported yet
  bool stdin = 9;            // not supported yet
}

message ProcessRef {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
}

message ListProcessesRequest {
  string tenant = 1;
  string sandbox = 2;
}

message ListProcessesResponse {
  repeated Process processes = 1;
}

enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGTERM = 1;
  SIGKILL = 2;
  SIGINT = 3;
  SIGHUP = 4;
  SIGQUIT = 5;
  SIGUSR1 = 6;
  SIGUSR2 = 7;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STDOUT = 1;
  STDERR = 2;
}

message SignalProcessRequest {
  ProcessRef process = 1;
  Signal signal = 2;
}

message WaitProcessRequest {
  ProcessRef process = 1;
  uint64 timeout_ms = 2;  // 0: until exit (the call's deadline still applies)
}

message DeleteProcessRequest {
  ProcessRef process = 1;
  bool force = 2;
}

message DeleteProcessResponse {}

message Process {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  repeated string args = 4;
  string user = 5;
  bool tty = 6;
  string state = 7;             // starting | running | exited | lost
  uint32 pid = 8;               // PID inside the sandbox; 0 until running
  optional int32 exit_code = 9;
  // Set when a signal killed it; SIGNAL_UNSPECIFIED for a signal outside
  // the enum (e.g. SIGSEGV).
  optional Signal signal = 10;
  uint64 stdout_dropped = 11;   // bytes written past output_limit and discarded
  uint64 stderr_dropped = 12;
  int64 created_at = 13;
  optional int64 exited_at = 14;
  uint64 output_limit = 15;     // bytes kept per stream
}

message ReadOutputRequest {
  ProcessRef process = 1;
  Stream stream = 2;
  uint64 offset = 3;            // byte offset within that stream
  bool follow = 4;
}

message OutputChunk {
  oneof kind {
    Data data = 1;
    Truncated truncated = 2;
  }
  message Data {
    uint64 offset = 1;
    bytes bytes = 2;
  }
  // Sent once when a read reaches the stream's limit and output was dropped.
  // Generated by the read path; never stored.
  message Truncated {
    uint64 offset = 1;
    uint64 dropped_bytes = 2;
  }
}

message HealthRequest {}

message ComponentHealth {
  string name = 1;
  bool ok = 2;
  string message = 3;
}

message HealthResponse {
  // False when quota or runtime enforcement is failing; creates are refused.
  bool enforcing = 1;
  repeated ComponentHealth components = 2;
}

message WatchEventsRequest {}

message Event {
  int64 time = 1;
  oneof kind {
    SandboxExited sandbox_exited = 2;
    SandboxOom sandbox_oom = 3;
    QuotaExceeded quota_exceeded = 4;
    ReconcileAction reconcile = 5;
    ProcessExited process_exited = 6;
  }
}

message SandboxExited {
  string tenant = 1;
  string id = 2;
  optional int32 exit_code = 3;
}

message SandboxOom {
  string tenant = 1;
  string id = 2;
}

message QuotaExceeded {
  string tenant = 1;
  uint64 used_bytes = 2;
  uint64 limit_bytes = 3;
}

message ReconcileAction {
  string action = 1;
  string target = 2;
  string detail = 3;
}

message ProcessExited {
  string tenant = 1;
  string sandbox = 2;
  string id = 3;
  optional int32 exit_code = 4;
  optional Signal signal = 5;
  uint64 stdout_dropped = 6;
  uint64 stderr_dropped = 7;
}
